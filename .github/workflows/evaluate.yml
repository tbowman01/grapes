name: AI Model Evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Model provider to use'
        required: false
        default: 'ollama'
        type: choice
        options:
          - ollama
          - openai
          - anthropic
  pull_request:
    paths:
      - 'eval/**'
      - '.github/workflows/evaluate.yml'
  schedule:
    # Run evaluations nightly at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/automation-runner

jobs:
  validate-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          bash scripts/ci-validate-env.sh || echo "Validation script not yet implemented"

  evaluate:
    runs-on: ubuntu-latest
    needs: validate-env
    strategy:
      matrix:
        provider: [ollama]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull automation runner image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run Promptfoo evaluations
        working-directory: eval
        env:
          EVAL_MODEL_PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx --yes promptfoo@latest eval -c promptfoo.yaml
        continue-on-error: true

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.provider }}
          path: eval/output/
          retention-days: 30

      - name: Generate evaluation summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🧪 Evaluation Results (${{ matrix.provider }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Evaluation completed for provider: \`${{ matrix.provider }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f eval/output/latest.json ]; then
            echo "✅ Results available in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🧪 AI Evaluation Results\n\n';
            comment += `**Provider:** \`${{ matrix.provider }}\`\n`;
            comment += `**Status:** Evaluation completed\n\n`;
            comment += '📊 Detailed results are available in the workflow artifacts.\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
