name: Workflow Failure Alert

on:
  workflow_run:
    workflows:
      - "Build and Publish Container Image"
      - "AI Model Evaluation"
      - "Security Scanning"
      - "Deploy Documentation"
    types:
      - completed

permissions:
  actions: read
  issues: write

jobs:
  alert:
    name: Check Workflow Status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate failure report
        id: report
        run: |
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          COMMIT="${{ github.event.workflow_run.head_sha }}"

          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Create issue for failure
        if: github.event.workflow_run.head_branch == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = '${{ steps.report.outputs.workflow_name }}';
            const runUrl = '${{ steps.report.outputs.run_url }}';
            const branch = '${{ steps.report.outputs.branch }}';
            const commit = '${{ steps.report.outputs.commit }}';

            const title = `🚨 Workflow Failure: ${workflowName}`;
            const body = `## Workflow Failure Report

            **Workflow:** ${workflowName}
            **Branch:** \`${branch}\`
            **Commit:** \`${commit.substring(0, 7)}\`
            **Run URL:** ${runUrl}
            **Time:** ${new Date().toISOString()}

            ### Details

            The workflow "${workflowName}" failed on the \`${branch}\` branch.

            ### Action Required

            1. Review the workflow run logs: ${runUrl}
            2. Identify the root cause of the failure
            3. Fix the issue and push a new commit
            4. Close this issue once resolved

            ### Related Information

            - [Workflow Runs](https://github.com/${{ github.repository }}/actions)
            - [Recent Commits](https://github.com/${{ github.repository }}/commits/${branch})

            ---
            *This issue was automatically created by the Workflow Failure Alert system.*
            `;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 10
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes(workflowName) &&
              issue.body.includes(commit.substring(0, 7))
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['workflow-failure', 'bug', 'priority: high']
              });

              console.log('Created new failure issue');
            } else {
              console.log('Similar issue already exists, skipping creation');
            }

      - name: Add comment to PR if applicable
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = '${{ steps.report.outputs.workflow_name }}';
            const runUrl = '${{ steps.report.outputs.run_url }}';

            // Get PR number from workflow run
            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ steps.report.outputs.commit }}'
            });

            if (pulls.data.length > 0) {
              const prNumber = pulls.data[0].number;

              const comment = `## ⚠️ Workflow Failure

              The **${workflowName}** workflow failed for this PR.

              **Run URL:** ${runUrl}

              Please review the logs and fix any issues before merging.
              `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

      - name: Generate summary
        run: |
          echo "## 🚨 Workflow Failure Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ steps.report.outputs.workflow_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.report.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.report.outputs.commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run URL:** ${{ steps.report.outputs.run_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "An issue has been created to track this failure." >> $GITHUB_STEP_SUMMARY
