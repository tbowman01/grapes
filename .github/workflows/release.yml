name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/automation-runner

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Validated version: $VERSION"

  build:
    name: Build Release Artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/automation-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-${{ steps.version.outputs.version }}.json

      - name: Create release archive
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Create release directory
          mkdir -p release

          # Copy essential files
          cp README.md release/
          cp LICENSE release/
          cp CONTRIBUTING.md release/
          cp .env.example release/
          cp Makefile release/
          cp package.json release/
          cp requirements.txt release/

          # Copy directories
          cp -r .github release/
          cp -r containers release/
          cp -r scripts release/
          cp -r eval release/
          cp -r src release/
          cp -r tests release/
          cp -r .adr release/

          # Create tarball
          tar -czf grapes-hub-v${VERSION}.tar.gz -C release .

          # Create checksums
          sha256sum grapes-hub-v${VERSION}.tar.gz > grapes-hub-v${VERSION}.tar.gz.sha256

          echo "Release archive created: grapes-hub-v${VERSION}.tar.gz"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            grapes-hub-*.tar.gz
            grapes-hub-*.tar.gz.sha256
            sbom-*.json

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to v$VERSION"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "No previous tag found, generating full changelog"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save changelog to file
          cat > CHANGELOG.md <<EOF
          ## What's Changed

          ${CHANGELOG}

          ## Docker Images

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}/automation-runner:${VERSION}
          docker pull ghcr.io/${{ github.repository }}/automation-runner:latest
          \`\`\`

          ## Installation

          \`\`\`bash
          # Download and extract
          wget https://github.com/${{ github.repository }}/releases/download/v${VERSION}/grapes-hub-v${VERSION}.tar.gz
          tar -xzf grapes-hub-v${VERSION}.tar.gz
          cd grapes-hub

          # Setup
          make setup
          make image
          \`\`\`

          ## Full Changelog

          [View all commits](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION})
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GRAPES Hub v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            grapes-hub-*.tar.gz
            grapes-hub-*.tar.gz.sha256
            sbom-*.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release summary
        run: |
          VERSION=${{ steps.version.outputs.version }}

          echo "## 🎉 Release v${VERSION} Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** \`ghcr.io/${{ github.repository }}/automation-runner:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Source tarball with checksums" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM (CycloneDX JSON)" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images (multi-tag)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}/automation-runner:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
