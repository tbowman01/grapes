name: Housekeeping

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale-issues:
    name: Mark Stale Issues
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed if no further activity occurs within the next 7 days.
            If this issue is still relevant, please comment to keep it open.
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed if no further activity occurs within the next 7 days.
            If this PR is still relevant, please comment or push new commits.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            Feel free to reopen if this issue is still relevant.
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen if you plan to continue work on this.
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security,work-in-progress'

  label-sync:
    name: Sync Repository Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-other-labels: false

  greeting:
    name: Greet New Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to GRAPES Hub! Thanks for opening your first issue.

            Please make sure you've provided all the necessary information in the issue template.
            A maintainer will review your issue and respond as soon as possible.

            Check out our [Contributing Guide](CONTRIBUTING.md) for more information.
          pr-message: |
            🎉 Welcome to GRAPES Hub! Thanks for opening your first pull request.

            Please make sure:
            - [ ] Your PR follows our [Contributing Guidelines](CONTRIBUTING.md)
            - [ ] You've added tests for new functionality
            - [ ] Documentation has been updated
            - [ ] All CI checks pass

            A maintainer will review your PR shortly. Thanks for contributing!

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '90 days'
          skip-recent: 5

  dependency-update-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for outdated dependencies
        run: |
          npm outdated || true
          echo "## 📦 Dependency Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check completed. Review outdated dependencies above." >> $GITHUB_STEP_SUMMARY

  repo-metrics:
    name: Repository Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate metrics
        run: |
          echo "## 📊 Repository Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Commits:** $(git rev-list --all --count)" >> $GITHUB_STEP_SUMMARY
          echo "**Contributors:** $(git shortlog -sn --all | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Branches:** $(git branch -r | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Last Commit:** $(git log -1 --format=%cd --date=relative)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recent Activity" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git log --oneline --no-merges -10 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
