# Label configuration for GRAPES Hub

# Type labels
- name: 'bug'
  color: 'd73a4a'
  description: 'Something is not working correctly'

- name: 'enhancement'
  color: 'a2eeef'
  description: 'New feature or request'

- name: 'documentation'
  color: '0075ca'
  description: 'Improvements or additions to documentation'

- name: 'refactor'
  color: 'fbca04'
  description: 'Code refactoring without changing functionality'

- name: 'test'
  color: '1d76db'
  description: 'Testing improvements'

# Priority labels
- name: 'priority: critical'
  color: 'b60205'
  description: 'Must be fixed immediately'

- name: 'priority: high'
  color: 'd93f0b'
  description: 'Should be fixed soon'

- name: 'priority: medium'
  color: 'fbca04'
  description: 'Normal priority'

- name: 'priority: low'
  color: '0e8a16'
  description: 'Low priority'

# Status labels
- name: 'status: needs triage'
  color: 'ededed'
  description: 'Needs to be reviewed by maintainers'

- name: 'status: in progress'
  color: 'c2e0c6'
  description: 'Work is in progress'

- name: 'status: blocked'
  color: 'e99695'
  description: 'Blocked by external dependency'

- name: 'status: needs review'
  color: 'fbca04'
  description: 'Waiting for code review'

# Area labels
- name: 'area: evaluation'
  color: '5319e7'
